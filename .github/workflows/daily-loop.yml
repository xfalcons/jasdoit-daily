name: Daily loop

# The yaml only passes env and inputs; every arming decision lives in
# tools/daily-loop.py (amendment 4): schedule runs live only when repo
# variable ENGINE_LIVE == "true", dispatch runs live only when the `live`
# input is explicitly true, everything else runs dry.
on:
  schedule:
    # 06:00 Taipei daily
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Backfill day (past days only); empty = scheduled day'
        required: false
        default: ''
        type: string
      live:
        description: 'Run live (publish/upload); ignores ENGINE_LIVE'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One live run at a time; never cancel an in-flight engine run (amendment 8)
concurrency:
  group: daily-loop
  cancel-in-progress: false

jobs:
  loop:
    # Pinned image: 3.13.7 ships only the generic linux build, which
    # setup-python cannot resolve on ubuntu-26.04; 24.04 can. Byte-identical
    # gold replay needs the pinned python, so the runner stays pinned too.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Gold baselines are byte-compared; the pinned patch version is the
          # recorded baseline environment (amendment 2)
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: tools/requirements-engine.txt

      - name: Install engine dependencies
        run: pip install -r tools/requirements-engine.txt

      - name: Run daily loop
        env:
          LOOP_EVENT: ${{ github.event_name }}
          LOOP_DAY: ${{ inputs.day }}
          LOOP_DISPATCH_LIVE: ${{ inputs.live }}
          ENGINE_LIVE: ${{ vars.ENGINE_LIVE }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          GEN_MODEL: ${{ vars.GEN_MODEL }}
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL }}
          VERIFY_MODEL2: ${{ vars.VERIFY_MODEL2 }}
          AUTO_PUSH_N3: ${{ vars.AUTO_PUSH_N3 }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LOOP_PAT: ${{ secrets.LOOP_PAT }}
        run: python tools/daily-loop.py
